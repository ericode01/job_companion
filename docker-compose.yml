# Postgres for local development: `docker compose up -d`, then `pnpm dev`.
# Matches the default DATABASE_URL (postgres://jobs:jobs@127.0.0.1:54317/jobs), so nothing to configure.
# Port 54317 rather than 5432, so it runs beside a Postgres you may already have.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
      POSTGRES_DB: jobs
    ports:
      - "127.0.0.1:54317:5432"
    volumes:
      - jc-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs -d jobs"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  jc-postgres:
